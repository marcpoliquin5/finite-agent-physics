[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-physics"
version = "5.0.0rc1"
description = "Constraint-native scheduling and execution science for agentic systems"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Marc Poliquin" }]
keywords = ["agents", "orchestration", "scheduling", "watsonx", "granite", "ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mcp>=1.27,<2"]
api = ["uvicorn>=0.35,<1"]
mcp = ["mcp>=1.27,<2"]
watsonx = ["ibm-watsonx-ai>=1.5,<2"]
langgraph = ["langgraph==1.2.9", "langgraph-checkpoint-sqlite==3.1.0"]

[project.scripts]
agent-physics = "agent_physics.cli:main"
finite-mcp = "agent_physics.mcp_server:main"
finite-api = "agent_physics.control_service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
