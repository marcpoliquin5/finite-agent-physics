name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            coverage: true
            lint: true
            extras: dev,api,langgraph
          - os: ubuntu-latest
            python-version: "3.12"
            coverage: false
            lint: false
            extras: dev,api,langgraph
          - os: ubuntu-latest
            python-version: "3.13"
            coverage: false
            lint: false
            extras: dev,api,langgraph
          - os: ubuntu-latest
            python-version: "3.14"
            coverage: false
            lint: false
            extras: dev,api,langgraph
          - os: windows-latest
            python-version: "3.11"
            coverage: false
            lint: false
            extras: dev,api,langgraph
          - os: macos-latest
            python-version: "3.14"
            coverage: false
            lint: false
            extras: dev,api,langgraph
    steps:
      # Major-version tags resolved to these immutable commits on 2026-07-22.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/test-tools.txt
      - name: Verify fresh clean checkout
        run: >-
          python -c "import subprocess;
          s=subprocess.check_output(['git','status','--porcelain=v1','--untracked-files=all'],text=True);
          assert not s,s"
      - name: Install pinned gate tooling and project
        run: |
          python -m pip install "pip==26.1.2"
          python -m pip install -r requirements/test-tools.txt
          python -m pip install -e ".[${{ matrix.extras }}]"
      - name: Dependency consistency
        run: python -m pip check
      - name: Ruff
        if: ${{ matrix.lint }}
        run: python -m ruff check .
      - name: Validate GitHub Actions workflow semantics
        if: ${{ matrix.lint }}
        shell: bash
        run: |
          set -euo pipefail
          ACTIONLINT_ARCHIVE="${RUNNER_TEMP}/actionlint_1.7.12_linux_amd64.tar.gz"
          ACTIONLINT_DIR="${RUNNER_TEMP}/actionlint-1.7.12"
          curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "${ACTIONLINT_ARCHIVE}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${ACTIONLINT_ARCHIVE}" \
            | sha256sum --check --strict
          mkdir "${ACTIONLINT_DIR}"
          tar --extract --gzip --file "${ACTIONLINT_ARCHIVE}" --directory "${ACTIONLINT_DIR}"
          "${ACTIONLINT_DIR}/actionlint" -no-color
      - name: Prepare test evidence directory
        run: python -c "from pathlib import Path; Path('artifacts').mkdir(exist_ok=True)"
      - name: Test with coverage floor
        if: ${{ matrix.coverage }}
        run: >-
          python -m pytest
          --cov-branch
          --cov=agent_physics
          --cov-report=json:artifacts/coverage.json
          --cov-report=term-missing
          --junitxml=artifacts/pytest-junit.xml
          --strict-markers
          -o xfail_strict=true
      - name: Test
        if: ${{ !matrix.coverage }}
        run: >-
          python -m pytest
          --junitxml=artifacts/pytest-junit.xml
          --strict-markers
          -o xfail_strict=true
      - name: Reject failed, errored, skipped, xfailed, or disabled tests
        run: python scripts/validate_junit.py artifacts/pytest-junit.xml
      - name: Enforce separate statement and branch coverage floors
        if: ${{ matrix.coverage }}
        run: >-
          python scripts/validate_coverage.py artifacts/coverage.json
          --statement-floor 90
          --branch-floor 80
      - name: Generate the default 64-run loopback load proof
        if: ${{ matrix.coverage }}
        run: python scripts/run_live_load.py --output artifacts/live-load
      - name: Independently re-verify the digest-bound load proof
        if: ${{ matrix.coverage }}
        run: python scripts/run_live_load.py --verify-only artifacts/live-load
      - name: Upload Python test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: finite-python-${{ matrix.os }}-py${{ matrix.python-version }}-evidence
          path: |
            artifacts/pytest-junit.xml
            artifacts/coverage.json
            artifacts/live-load/
          if-no-files-found: error
          retention-days: 90
      - name: Installed CLI preflight
        run: agent-physics preflight
      - name: Judge-bundle CLI smoke test
        if: ${{ matrix.coverage }}
        run: python -m agent_physics.cli judge-bundle --revision ci-unverified
      - name: Tests did not mutate tracked files
        run: >-
          python -c "import subprocess;
          s=subprocess.check_output(['git','status','--porcelain=v1','--untracked-files=all'],text=True);
          assert not s,s"

  package-candidate:
    name: Build and inspect release candidate
    needs: python
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/release-tools.txt
      - name: Verify fresh clean checkout
        run: >-
          python -c "import subprocess;
          s=subprocess.check_output(['git','status','--porcelain=v1','--untracked-files=all'],text=True);
          assert not s,s"
      - name: Install pinned gate tooling and project
        run: |
          python -m pip install "pip==26.1.2"
          python -m pip install -r requirements/release-tools.txt
          python -m pip install -e ".[dev,api,watsonx,langgraph]"
          python -m pip check
      - name: Capture deterministic source inputs
        id: source
        shell: bash
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"
      - name: Build wheel and source distribution twice
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source.outputs.epoch }}
        shell: bash
        run: |
          mkdir -p artifacts/release-build/raw-a artifacts/release-build/raw-b
          mkdir -p artifacts/release-build/dist-a artifacts/release-build/dist-b
          python -m build --sdist --wheel --outdir artifacts/release-build/raw-a
          python -m build --sdist --wheel --outdir artifacts/release-build/raw-b
          cp artifacts/release-build/raw-a/*.whl artifacts/release-build/dist-a/
          cp artifacts/release-build/raw-b/*.whl artifacts/release-build/dist-b/
          for input in artifacts/release-build/raw-a/*.tar.gz; do
            python scripts/normalize_sdist.py "$input" \
              "artifacts/release-build/dist-a/$(basename "$input")" \
              --source-date-epoch "$SOURCE_DATE_EPOCH"
          done
          for input in artifacts/release-build/raw-b/*.tar.gz; do
            python scripts/normalize_sdist.py "$input" \
              "artifacts/release-build/dist-b/$(basename "$input")" \
              --source-date-epoch "$SOURCE_DATE_EPOCH"
          done
          diff --recursive --no-dereference \
            artifacts/release-build/dist-a artifacts/release-build/dist-b
      - name: Validate package metadata rendering
        run: python -m twine check artifacts/release-build/dist-a/*
      - name: Generate deterministic candidate evidence twice
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source.outputs.epoch }}
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        shell: bash
        run: |
          python scripts/generate_release_candidate.py \
            --dist-dir artifacts/release-build/dist-a \
            --output-dir artifacts/release-build/candidate \
            --source-revision "$SOURCE_REVISION" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --source-state clean
          python scripts/generate_release_candidate.py \
            --dist-dir artifacts/release-build/dist-a \
            --output-dir artifacts/release-build/candidate-repeat \
            --source-revision "$SOURCE_REVISION" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --source-state clean
          diff --recursive --no-dereference \
            artifacts/release-build/candidate artifacts/release-build/candidate-repeat
      - name: Verify candidate evidence offline
        run: >-
          python scripts/verify_release_candidate.py
          artifacts/release-build/candidate
      - name: Validate CycloneDX schema
        run: >-
          python scripts/validate_sbom.py
          artifacts/release-build/candidate/release-candidate.sbom.cdx.json
      - name: Rebuild a wheel from the source distribution
        shell: bash
        run: |
          mkdir artifacts/release-build/rebuilt
          python -m pip wheel --no-deps \
            --wheel-dir artifacts/release-build/rebuilt \
            artifacts/release-build/dist-a/*.tar.gz
          python -c "from pathlib import Path; assert len(list(Path('artifacts/release-build/rebuilt').glob('*.whl'))) == 1"
      - name: Smoke-test the built wheel in a clean environment
        shell: bash
        run: |
          python -m venv artifacts/release-build/smoke-venv
          artifacts/release-build/smoke-venv/bin/python -m pip install "pip==26.1.2"
          artifacts/release-build/smoke-venv/bin/python -m pip install \
            artifacts/release-build/dist-a/*.whl
          artifacts/release-build/smoke-venv/bin/python -m pip check
          artifacts/release-build/smoke-venv/bin/agent-physics preflight
          EXPECTED_VERSION=$(python -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          export EXPECTED_VERSION
          artifacts/release-build/smoke-venv/bin/python -c \
            "import importlib.metadata as m, os; assert m.version('agent-physics') == os.environ['EXPECTED_VERSION']"
      - name: Audit resolved all-extras and release-tool environment
        shell: bash
        run: |
          mkdir artifacts/release-build/security-reports
          python -m pip freeze --all --exclude agent-physics \
            > artifacts/release-build/security-reports/resolved-all-extras.txt
          python -m pip_audit \
            --strict \
            --progress-spinner off \
            --format json \
            --output artifacts/release-build/security-reports/pip-audit.json \
            --requirement artifacts/release-build/security-reports/resolved-all-extras.txt
      - name: Preserve and gate unsuppressed static-security findings
        shell: bash
        run: |
          python -m bandit -r src scripts --ignore-nosec \
            --format json \
            --output artifacts/release-build/security-reports/bandit.json \
            --exit-zero
          python scripts/validate_bandit.py \
            artifacts/release-build/security-reports/bandit.json
      - name: Preserve and gate installed dependency licenses
        shell: bash
        run: |
          python -m piplicenses --format=json --with-urls \
            --ignore-packages agent-physics \
            --output-file artifacts/release-build/security-reports/licenses.json
          python scripts/validate_licenses.py \
            artifacts/release-build/security-reports/licenses.json
      - name: Pipeline did not mutate the checkout
        run: >-
          python -c "import subprocess;
          s=subprocess.check_output(['git','status','--porcelain=v1','--untracked-files=all'],text=True);
          assert not s,s"
      - name: Upload candidate and advisory report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: finite-release-candidate-${{ github.sha }}
          path: |
            artifacts/release-build/candidate/
            artifacts/release-build/security-reports/
          if-no-files-found: error
          retention-days: 90

  container:
    name: Hardened API container
    needs: python
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Scan publishable source, configuration, secrets, and licenses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/container
          SOURCE_SNAPSHOT="${RUNNER_TEMP}/finite-source-snapshot"
          mkdir "${SOURCE_SNAPSHOT}"
          git archive --format=tar HEAD | tar --extract --directory "${SOURCE_SNAPSHOT}"
          docker run --rm \
            --volume "${SOURCE_SNAPSHOT}:/repo:ro" \
            --volume "${PWD}/artifacts/container:/reports" \
            aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            fs --scanners vuln,misconfig,secret,license --include-dev-deps \
            --format json --output /reports/trivy-source.json --no-progress /repo
          docker run --rm \
            --volume "${SOURCE_SNAPSHOT}:/repo:ro" \
            aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            fs --scanners vuln,misconfig,secret --include-dev-deps \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --exit-code 1 --no-progress /repo
      - name: Build the digest-pinned non-root image
        run: >-
          docker build
          --build-arg VCS_REF="${GITHUB_SHA}"
          --tag finite-agent-physics:ci
          .
      - name: Exercise the hardened runtime and HTTP boundaries
        shell: bash
        env:
          FINITE_CI_TOKEN: finite-ci-only-token-0123456789abcdef
        run: |
          set -euo pipefail
          mkdir -p artifacts/container
          docker volume create finite-ci-state >/dev/null
          docker run --detach --name finite-api-ci \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 256 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=0700 \
            --volume finite-ci-state:/var/lib/finite \
            --publish 127.0.0.1:18080:8080 \
            --env FINITE_CONTROL_BEARER_TOKEN="${FINITE_CI_TOKEN}" \
            finite-agent-physics:ci
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:18080/readyz \
              > artifacts/container/ready.json \
              && [ "$(docker inspect --format '{{.State.Health.Status}}' finite-api-ci)" = "healthy" ]; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              docker logs finite-api-ci
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/healthz \
            > artifacts/container/health.json
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18080/v1/reference-workflows)" = "401"
          curl --fail --silent \
            --header "Authorization: Bearer ${FINITE_CI_TOKEN}" \
            http://127.0.0.1:18080/v1/reference-workflows \
            > artifacts/container/authorized.json
          test "$(docker exec finite-api-ci id -u)" = "10001"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' finite-api-ci)" = "true"
          test "$(docker inspect --format '{{json .HostConfig.CapDrop}}' finite-api-ci)" = '["ALL"]'
          test "$(docker inspect --format '{{json .HostConfig.SecurityOpt}}' finite-api-ci)" = '["no-new-privileges:true"]'
          test "$(docker inspect --format '{{.State.Health.Status}}' finite-api-ci)" = "healthy"
      - name: Scan every package and fail on any detected CVE
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "${PWD}/artifacts/container:/reports" \
            aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            image --scanners vuln --format json --output /reports/trivy.json --no-progress \
            finite-agent-physics:ci
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "${PWD}/artifacts/container:/reports" \
            aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            image --format cyclonedx --output /reports/container.sbom.cdx.json --no-progress \
            finite-agent-physics:ci
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            image --scanners vuln --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --exit-code 1 --no-progress \
            finite-agent-physics:ci
      - name: Preserve the unsuppressed container scan
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: finite-container-security-${{ github.sha }}
          path: artifacts/container/
          if-no-files-found: error
          retention-days: 90
      - name: Stop the container
        if: ${{ always() }}
        shell: bash
        run: |
          docker rm --force finite-api-ci 2>/dev/null || true
          docker volume rm finite-ci-state 2>/dev/null || true

  console:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/physics-console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: apps/physics-console/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare console evidence directory
        run: mkdir -p ../../artifacts/console
      - name: Build production console
        run: npm run build
      - name: Render and artifact-boundary tests with JUnit evidence
        run: >-
          node --test
          --test-reporter=junit
          --test-reporter-destination=../../artifacts/console/node-junit.xml
          tests/rendered-html.test.mjs
      - name: Reject failed, cancelled, skipped, or todo console tests
        run: >-
          node ../../scripts/validate_node_junit.mjs
          ../../artifacts/console/node-junit.xml
      - name: Lint
        run: npm run lint
      - name: Dependency audit
        run: npm audit --audit-level=low --json > ../../artifacts/console/npm-audit.json
      - name: Upload console test and advisory evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: finite-console-evidence-${{ github.sha }}
          path: artifacts/console/
          if-no-files-found: error
          retention-days: 90

  langgraph-comparator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/test-tools.txt
      - name: Install pinned test tooling and comparator
        run: |
          python -m pip install "pip==26.1.2"
          python -m pip install -r requirements/test-tools.txt
          python -m pip install -e ".[dev,langgraph]"
      - name: Dependency consistency
        run: python -m pip check
      - name: Prepare comparator evidence directory
        run: python -c "from pathlib import Path; Path('artifacts').mkdir(exist_ok=True)"
      - name: LangGraph conformance tests
        run: >-
          python -m pytest -q tests/test_langgraph_baseline.py
          --junitxml=artifacts/langgraph-pytest-junit.xml
          --strict-markers
          -o xfail_strict=true
      - name: Reject comparator test skips and nonpass outcomes
        run: python scripts/validate_junit.py artifacts/langgraph-pytest-junit.xml
      - name: Export normalized comparator record
        run: >-
          python -m agent_physics.cli langgraph-baseline
          --run-id ci-langgraph-static-v1
          --output artifacts/langgraph-baseline.json
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: langgraph-static-comparator
          path: |
            artifacts/langgraph-baseline.json
            artifacts/langgraph-pytest-junit.xml
          if-no-files-found: error
          retention-days: 90
